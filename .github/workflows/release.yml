name: Build release downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build standalone app
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "sysclock-build"
          $assets = Join-Path $PWD "src\sysclock\assets"
          $versionFile = Join-Path $PWD "version_info.txt"
          $directories = @(
            (Join-Path $buildRoot "work"),
            (Join-Path $buildRoot "spec"),
            "dist"
          )
          New-Item -ItemType Directory -Force -Path $directories | Out-Null
          $arguments = @(
            "--noconfirm", "--clean", "--onefile", "--windowed",
            "--name", "SysClock",
            "--distpath", "dist",
            "--workpath", (Join-Path $buildRoot "work"),
            "--specpath", (Join-Path $buildRoot "spec"),
            "--icon=$(Join-Path $assets 'digital_clock_icon.ico')",
            "--version-file", $versionFile,
            "--add-data", "$assets;sysclock/assets",
            "--collect-all", "tzdata",
            "src\sysclock\__main__.py"
          )
          python -m PyInstaller @arguments
          Copy-Item "dist\SysClock.exe" "dist\SysClock-Windows-Portable.exe"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build setup wizard
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            $compiler = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Inno Setup compiler was not found."
          }
          $version = $env:RELEASE_TAG -replace '^v', ''
          & $compiler "/DAppVersion=$version" "installer\SysClock.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Attach Windows downloads to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: dist/SysClock-Windows-Setup.exe

      - name: Save Windows portable download for ordered publishing
        uses: actions/upload-artifact@v4
        with:
          name: SysClock-Windows-Portable
          path: dist/SysClock-Windows-Portable.exe
          if-no-files-found: error

  linux-release:
    needs: windows-release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.release.tag_name }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk python3-venv
          /usr/bin/python3.10 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install . pyinstaller

      - name: Build portable Linux app
        run: |
          build_root="$RUNNER_TEMP/sysclock-build"
          mkdir -p "$build_root/work" "$build_root/spec" dist
          .venv/bin/python -m PyInstaller \
            --noconfirm --clean --onefile --windowed \
            --name SysClock-Linux-x86_64 \
            --distpath dist \
            --workpath "$build_root/work" \
            --specpath "$build_root/spec" \
            --add-data "$GITHUB_WORKSPACE/src/sysclock/assets:sysclock/assets" \
            --collect-all tzdata \
            src/sysclock/__main__.py
          mkdir -p package/SysClock-Linux-x86_64
          cp dist/SysClock-Linux-x86_64 README.md LICENSE package/SysClock-Linux-x86_64/
          tar -czf dist/SysClock-Linux-x86_64.tar.gz -C package SysClock-Linux-x86_64

      - name: Attach Linux download to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: dist/SysClock-Linux-x86_64.tar.gz

  windows-portable-release:
    needs: linux-release
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows portable executable
        uses: actions/download-artifact@v4
        with:
          name: SysClock-Windows-Portable
          path: dist

      - name: Attach Windows portable download to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: dist/SysClock-Windows-Portable.exe
